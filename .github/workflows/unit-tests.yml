name: Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11/3.12 cover the DevStack target (Ubuntu 24.04 ships 3.12);
        # 3.14 is what upstream manila gates on (openstack-tox-py314).
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: stubs:${{ github.workspace }}
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: stubs:${{ github.workspace }}
        run: |
          pytest tests/unit/ --cov=manila/share/drivers/weka \
            --cov-report=term-missing \
            --cov-fail-under=100
